<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Skill Router — per-turn skill selection</title>
  <desc id="desc">A catalog of skills passes through Skill Router. Only selected instructions and suggested candidates reach the agent.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131b3a"/>
    </linearGradient>
    <linearGradient id="word">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .caption { font-size: 13px; letter-spacing: 2px; fill: #a3aecb; }
  </style>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#dots)"/>
  <text x="64" y="80" class="mono" font-size="14" letter-spacing="3" fill="#a5b4fc">PER-TURN SKILL SELECTION</text>
  <text x="58" y="185" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#word)">Skill Router</text>
  <text x="64" y="232" font-size="24" fill="#e6edf3">The right skills. Every turn.</text>
  <text x="64" y="290" class="mono" font-size="15" fill="#a3aecb">LangChain · deepagents · Jev or any judge</text>

  <text x="653" y="80" text-anchor="middle" class="mono caption">CATALOG</text>
  <text x="1043" y="80" text-anchor="middle" class="mono caption">AGENT CONTEXT</text>
  <g fill="#18213c" stroke="#394669">
    <rect x="594" y="108" width="118" height="28" rx="6"/>
    <rect x="594" y="150" width="118" height="28" rx="6"/>
    <rect x="594" y="192" width="118" height="28" rx="6"/>
    <rect x="594" y="234" width="118" height="28" rx="6"/>
  </g>
  <g stroke="#637393" stroke-width="3" stroke-linecap="round">
    <path d="M609 122h55 M609 164h72 M609 206h42 M609 248h62"/>
  </g>
  <g fill="none" stroke="#46577e" stroke-width="1.5">
    <path d="M712 122C750 122 747 178 788 178 M712 164C750 164 747 178 788 178"/>
    <path d="M712 206C750 206 747 194 788 194 M712 248C750 248 747 194 788 194"/>
  </g>
  <rect x="788" y="140" width="116" height="92" rx="16" fill="#1a2350" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="846" y="179" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Skill Router</text>
  <text x="846" y="205" text-anchor="middle" class="mono" font-size="12" fill="#bac4e1">rank + verify</text>
  <path d="M904 175C929 175 926 151 950 151" fill="none" stroke="#67e8f9" stroke-width="2"/>
  <path d="M904 197C929 197 926 223 950 223" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="950" y="127" width="186" height="48" rx="10" fill="#142f41" stroke="#67e8f9"/>
  <circle cx="969" cy="151" r="4" fill="#67e8f9"/>
  <text x="987" y="157" font-size="17" fill="#e6edf3">Instructions</text>
  <rect x="950" y="199" width="186" height="48" rx="10" fill="#1a2344" stroke="#818cf8"/>
  <circle cx="969" cy="223" r="4" fill="#a5b4fc"/>
  <text x="987" y="229" font-size="17" fill="#e6edf3">Candidates</text>
  <text x="865" y="290" text-anchor="middle" class="mono" font-size="14" fill="#a3aecb">A focused selection, not the whole catalog.</text>
</svg>
