name: Publish

# Uploads exactly the files attached to a release, so what reaches PyPI is byte for byte what the
# release holds. Authentication is PyPI trusted publishing: no token is stored anywhere, GitHub's OIDC
# identity is exchanged for a short-lived credential.
#
# Three ways in, because the release event alone is not enough:
#   release        — a release published by hand in the web interface;
#   workflow_call  — the release workflow, which creates releases with GITHUB_TOKEN. GitHub does not
#                    start a workflow from an event raised by that token, so the release trigger never
#                    fires for those and the release workflow has to call this one directly;
#   workflow_dispatch — republishing a tag whose release was already created, v0.1.0 among them.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: The release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, for example v0.1.0
        required: true
        type: string

jobs:
  pypi:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      # The name must match the environment in the PyPI publisher configuration; the url puts a link to
      # the package on the deployment in GitHub's own interface.
      name: pypi
      url: https://pypi.org/p/langchain-loadout
    permissions:
      contents: read         # download the release assets
      id-token: write        # exchange for a PyPI credential
    env:
      GH_TOKEN: ${{ github.token }}
      # `inputs` is set for a call and a dispatch, and empty for a release event.
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Take the distributions from the release
        # Only the distributions: anything else attached to a release is not publishable, and the
        # upload step takes whatever it finds in dist/.
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'

      - name: Upload them to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
